---
- name: Verify iVentoy playbook
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Verify Python is installed
      ansible.builtin.command: python3 --version
      register: python_version
      changed_when: false

    - name: Assert Python is available
      ansible.builtin.assert:
        that:
          - python_version.rc == 0
        fail_msg: "Python3 should be installed"

    - name: Verify apt is functional
      ansible.builtin.apt:
        name: file
        state: present
      register: apt_check

    - name: Assert apt is working
      ansible.builtin.assert:
        that:
          - apt_check is success
        fail_msg: "apt should be functional"

    # Verify iVentoy installation
    - name: Check iVentoy installation directory exists
      ansible.builtin.stat:
        path: /opt/iventoy
      register: iventoy_install_dir

    - name: Assert iVentoy installation directory exists
      ansible.builtin.assert:
        that:
          - iventoy_install_dir.stat.exists
          - iventoy_install_dir.stat.isdir
        fail_msg: "iVentoy installation directory should exist"

    - name: Check iventoy.sh script exists and is executable
      ansible.builtin.stat:
        path: /opt/iventoy/iventoy.sh
      register: iventoy_script

    - name: Assert iventoy.sh is installed and executable
      ansible.builtin.assert:
        that:
          - iventoy_script.stat.exists
          - iventoy_script.stat.executable
        fail_msg: "iventoy.sh should be installed and executable"

    - name: Check iVentoy lib directory exists
      ansible.builtin.stat:
        path: /opt/iventoy/lib
      register: iventoy_lib

    - name: Assert iVentoy lib directory exists
      ansible.builtin.assert:
        that:
          - iventoy_lib.stat.exists
          - iventoy_lib.stat.isdir
        fail_msg: "iVentoy lib directory should be installed"

    - name: Check iVentoy data directory exists
      ansible.builtin.stat:
        path: /opt/iventoy/data
      register: iventoy_data

    - name: Assert iVentoy data directory exists
      ansible.builtin.assert:
        that:
          - iventoy_data.stat.exists
          - iventoy_data.stat.isdir
        fail_msg: "iVentoy data directory should exist"

    - name: Check iVentoy ISO directory exists
      ansible.builtin.stat:
        path: /opt/iventoy/iso
      register: iventoy_iso

    - name: Assert iVentoy ISO directory exists
      ansible.builtin.assert:
        that:
          - iventoy_iso.stat.exists
          - iventoy_iso.stat.isdir
        fail_msg: "iVentoy ISO directory should exist"

    - name: Check iVentoy systemd service file exists
      ansible.builtin.stat:
        path: /etc/systemd/system/iventoy.service
      register: iventoy_service_file

    - name: Assert iVentoy service file exists
      ansible.builtin.assert:
        that:
          - iventoy_service_file.stat.exists
        fail_msg: "iVentoy systemd service file should exist"

    - name: Verify service file content
      ansible.builtin.slurp:
        src: /etc/systemd/system/iventoy.service
      register: service_content

    - name: Assert service file contains correct paths
      ansible.builtin.assert:
        that:
          - "'/opt/iventoy' in (service_content.content | b64decode)"
          - "'iventoy.sh' in (service_content.content | b64decode)"
        fail_msg: "Service file should contain correct iVentoy paths"

    - name: Check required packages are installed
      ansible.builtin.command: dpkg-query -W -f='${Status}' {{ item }}
      register: package_check
      loop:
        - wget
        - tar
      changed_when: false
      failed_when: false

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - "'install ok installed' in item.stdout"
        fail_msg: "Package {{ item.item }} should be installed"
      loop: "{{ package_check.results }}"
      when: item.rc == 0

    - name: Verify iventoy.sh can be executed (dry run)
      ansible.builtin.command: bash /opt/iventoy/iventoy.sh --help
      register: iventoy_help
      changed_when: false
      failed_when: false

    - name: Display verification summary
      ansible.builtin.debug:
        msg:
          - "iVentoy playbook verification complete!"
          - "Python: {{ python_version.stdout }}"
          - "APT status: OK"
          - "Installation directory: OK"
          - "iventoy.sh script: OK"
          - "iVentoy lib directory: OK"
          - "Data directory: OK"
          - "ISO directory: OK"
          - "Systemd service file: OK"
          - "Required packages: OK"
