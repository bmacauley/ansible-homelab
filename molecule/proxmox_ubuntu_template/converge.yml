---
- name: Converge - Test proxmox_ubuntu_template role
  hosts: all
  gather_facts: true
  become: true
  vars:
    # Use a small test file instead of downloading real Ubuntu cloud image
    # Override the image URL to use a local test file
    proxmox_ubuntu_template_image_url: "file:///tmp/test-image.img"
    proxmox_ubuntu_template_vmid: 9999
    proxmox_ubuntu_template_name: "test-ubuntu-template"
    proxmox_ubuntu_template_description: "Test template for molecule"
    proxmox_ubuntu_template_storage: "local-lvm"
    proxmox_ubuntu_template_memory: 1024
    proxmox_ubuntu_template_cores: 1
    proxmox_ubuntu_template_disk_size: "8G"
    proxmox_ubuntu_template_ciuser: "testuser"
    proxmox_ubuntu_template_sshkeys: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAITest test@molecule"
    proxmox_ubuntu_template_ipconfig: "ip=dhcp"
    proxmox_ubuntu_template_packages:
      - qemu-guest-agent

  pre_tasks:
    - name: Create test image file
      ansible.builtin.command: dd if=/dev/zero of=/tmp/test-image.img bs=1M count=1
      args:
        creates: /tmp/test-image.img
      changed_when: false

    - name: Copy test image to expected location
      ansible.builtin.copy:
        src: /tmp/test-image.img
        dest: /var/lib/vz/template/iso/noble-server-cloudimg-amd64.img
        remote_src: true
        mode: "0644"

  roles:
    - role: proxmox_ubuntu_template
      tags:
        - proxmox-ubuntu-template

  tasks:
    - name: Display test summary
      ansible.builtin.debug:
        msg:
          - "proxmox_ubuntu_template role test complete!"
          - "Role executed with mock qm commands"
          - "VMID: {{ proxmox_ubuntu_template_vmid }}"
          - "Template name: {{ proxmox_ubuntu_template_name }}"
